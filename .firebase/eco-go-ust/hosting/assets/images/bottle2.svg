<svg width="100" height="200" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#B0E0E6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="capGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Crushed bottle body - irregular shape -->
  <path d="M25 40 L30 50 L20 70 L35 90 L15 110 L40 130 L20 150 L35 170 Q35 180 45 180 L55 180 Q65 180 65 170 L80 150 L60 130 L85 110 L65 90 L80 70 L70 50 L75 40 Z" 
        fill="url(#bottleGradient2)" 
        stroke="#4682B4" 
        stroke-width="1"/>
  
  <!-- Crease lines to show crushing -->
  <path d="M30 50 L70 50" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  <path d="M20 70 L80 70" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  <path d="M35 90 L65 90" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  <path d="M15 110 L85 110" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  <path d="M40 130 L60 130" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  <path d="M20 150 L80 150" stroke="#4682B4" stroke-width="1" opacity="0.8"/>
  
  <!-- Bottle neck -->
  <rect x="35" y="20" width="30" height="20" 
        fill="url(#bottleGradient2)" 
        stroke="#4682B4" 
        stroke-width="1"/>
  
  <!-- Bottle cap -->
  <rect x="30" y="10" width="40" height="15" 
        rx="2" ry="2"
        fill="url(#capGradient2)" 
        stroke="#000080" 
        stroke-width="1"/>
  
  <!-- Cap ridges -->
  <line x1="32" y1="12" x2="68" y2="12" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="15" x2="68" y2="15" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="18" x2="68" y2="18" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="21" x2="68" y2="21" stroke="#000080" stroke-width="0.5"/>
  
  <!-- Highlight on bottle -->
  <ellipse cx="45" cy="85" rx="6" ry="25" fill="white" opacity="0.2"/>
</svg>
