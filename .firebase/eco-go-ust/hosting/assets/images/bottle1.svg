<svg width="100" height="200" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#B0E0E6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="capGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bottle body -->
  <path d="M25 40 L25 170 Q25 180 35 180 L65 180 Q75 180 75 170 L75 40 Z" 
        fill="url(#bottleGradient1)" 
        stroke="#4682B4" 
        stroke-width="1"/>
  
  <!-- Bottle ridges -->
  <line x1="25" y1="60" x2="75" y2="60" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  <line x1="25" y1="80" x2="75" y2="80" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  <line x1="25" y1="100" x2="75" y2="100" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  <line x1="25" y1="120" x2="75" y2="120" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  <line x1="25" y1="140" x2="75" y2="140" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  <line x1="25" y1="160" x2="75" y2="160" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Bottle neck -->
  <rect x="35" y="20" width="30" height="20" 
        fill="url(#bottleGradient1)" 
        stroke="#4682B4" 
        stroke-width="1"/>
  
  <!-- Bottle cap -->
  <rect x="30" y="10" width="40" height="15" 
        rx="2" ry="2"
        fill="url(#capGradient1)" 
        stroke="#000080" 
        stroke-width="1"/>
  
  <!-- Cap ridges -->
  <line x1="32" y1="12" x2="68" y2="12" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="15" x2="68" y2="15" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="18" x2="68" y2="18" stroke="#000080" stroke-width="0.5"/>
  <line x1="32" y1="21" x2="68" y2="21" stroke="#000080" stroke-width="0.5"/>
  
  <!-- Highlight on bottle -->
  <ellipse cx="40" cy="80" rx="8" ry="30" fill="white" opacity="0.3"/>
</svg>
